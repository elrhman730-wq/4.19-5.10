name: KSUN + SUSFS v2.4.0 A13VE Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/susfs_v2_a13ve_preflight.yml'
      - '.github/workflows/build_kernel_a13ve_oneui17.yml'
      - 'Profiles/a13ve_oneui17.env'
      - 'Patches/prepare_susfs_v2_4_0.py'
      - 'Patches/prepare_ksun_susfs_v2_4_0.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Validate KSUN and SUSFS v2.4.0 on A13VE Linux 4.19
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      KERNEL_REPO: https://github.com/AlfCraft07/android_kernel_samsung_mt6768-k419.git
      KERNEL_BRANCH: legion-mt6768
      KSU_REPO: https://github.com/wshamroukh/KernelSU-Next-SUSFS-kernelv4.19.git
      KSU_COMMIT: e821d0f6f4ca5fb35b18066764e538a5f336e2d8
      SUSFS_PATCH_URL: https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.19.patch
      SUSFS_PATCH_SHA256: 7e8463304562944f889159bcc554c0ed8891b34021ab5ef1bba15ee924780ab5

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Install preflight dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git curl patch python3

      - name: Clone exact A13VE Linux 4.19 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          test -s kernel/Makefile
          grep -q '^VERSION = 4$' kernel/Makefile
          grep -q '^PATCHLEVEL = 19$' kernel/Makefile
          test -s kernel/arch/arm64/configs/a13ve_defconfig
          git -C kernel log -1 --oneline

      - name: Clone and validate pinned KernelSU-Next v3.4.0 SUSFS bridge
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$KSU_REPO" KernelSU
          git -C KernelSU fetch --depth=1 origin "$KSU_COMMIT"
          git -C KernelSU checkout --detach "$KSU_COMMIT"
          test "$(git -C KernelSU rev-parse HEAD)" = "$KSU_COMMIT"
          python3 -m py_compile Patches/prepare_ksun_susfs_v2_4_0.py
          python3 Patches/prepare_ksun_susfs_v2_4_0.py KernelSU/kernel
          grep -q '^config KSU_SYSCALL_TABLE_HOOK$' KernelSU/kernel/Kconfig
          grep -q '^config KSU_SUSFS_PRIORITY_UID_FILTER$' KernelSU/kernel/Kconfig
          grep -q 'susfs_init();' KernelSU/kernel/core/init.c
          grep -q 'SUSFS_MAGIC' KernelSU/kernel/supercall/supercall.c
          echo "KernelSU-Next integration commit: $(git -C KernelSU rev-parse HEAD)"

      - name: Integrate KernelSU-Next Kconfig and Kbuild into Linux
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p drivers
          ln -s "$(realpath --relative-to="$PWD/drivers" "$GITHUB_WORKSPACE/KernelSU/kernel")" drivers/kernelsu
          grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          python3 - <<'PY'
          from pathlib import Path
          p = Path("drivers/Kconfig")
          s = p.read_text()
          entry = 'source "drivers/kernelsu/Kconfig"'
          if entry not in s:
              pos = s.rfind("endmenu")
              if pos < 0:
                  raise SystemExit("drivers/Kconfig has no closing endmenu anchor")
              s = s[:pos] + entry + "\n" + s[pos:]
              p.write_text(s)
          if s.count(entry) != 1:
              raise SystemExit("drivers/kernelsu Kconfig entry must occur exactly once")
          PY
          test -s drivers/kernelsu/Kbuild
          grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Download and verify SUSFS v2.4.0 patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "$SUSFS_PATCH_URL" -o susfs-2.4.0.patch
          echo "$SUSFS_PATCH_SHA256  susfs-2.4.0.patch" | sha256sum -c -
          grep -Fq '+#define SUSFS_VERSION "v2.4.0"' susfs-2.4.0.patch
          grep -Fq '+#define SUSFS_VARIANT "NON-GKI"' susfs-2.4.0.patch
          grep -Fq 'diff --git a/fs/susfs.c b/fs/susfs.c' susfs-2.4.0.patch

      - name: Dry-run and apply SUSFS v2.4.0
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/Patches/prepare_susfs_v2_4_0.py" "$GITHUB_WORKSPACE/susfs-2.4.0.patch"
          patch --dry-run --batch --forward --fuzz=3 -p1 < "$GITHUB_WORKSPACE/susfs-2.4.0.patch"
          patch --batch --forward --fuzz=3 -p1 < "$GITHUB_WORKSPACE/susfs-2.4.0.patch"
          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h
          grep -Fq '#define SUSFS_VERSION "v2.4.0"' include/linux/susfs.h
          grep -Fq '#define SUSFS_VARIANT "NON-GKI"' include/linux/susfs.h
          grep -Fq 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          grep -q 'susfs_is_priority_uid_filtered' fs/susfs.c

      - name: Apply Legion-specific SUSFS compatibility fixes
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("fs/namespace.c")
          s = p.read_text()
          anchor = "\tif (user_ns != ns->user_ns)\n\t\tcopy_flags |= CL_SHARED_TO_SLAVE | CL_UNPRIVILEGED;\n#ifdef CONFIG_KDP_NS"
          addition = "\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\tcopy_flags |= CL_COPY_MNT_NS;\n#endif"
          if s.count(anchor) != 1:
              raise SystemExit(f"copy_mnt_ns insertion anchor expected once, found {s.count(anchor)}")
          if "copy_flags |= CL_COPY_MNT_NS;" not in s:
              s = s.replace(anchor, anchor.replace("\n#ifdef CONFIG_KDP_NS", addition + "\n#ifdef CONFIG_KDP_NS"), 1)
              p.write_text(s)
          if s.count("copy_flags |= CL_COPY_MNT_NS;") != 1:
              raise SystemExit("SUSFS namespace-copy flag was not inserted exactly once")

          p = Path("fs/stat.c")
          s = p.read_text()
          marker = "#include <linux/compat.h>"
          inc = "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif"
          if inc not in s:
              if s.count(marker) != 1:
                  raise SystemExit(f"fs/stat.c include anchor mismatch: {s.count(marker)}")
              s = s.replace(marker, marker + "\n" + inc, 1)
              p.write_text(s)
          if inc not in p.read_text():
              raise SystemExit("SUSFS KSTAT definitions were not exposed to fs/stat.c")
          print("Legion-specific SUSFS compatibility anchors passed.")
          PY

      - name: Final SUSFS and KSUN integration assertions
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^config KSU_SUSFS_PRIORITY_UID_FILTER$' "$GITHUB_WORKSPACE/KernelSU/kernel/Kconfig"
          grep -q 'susfs_init();' "$GITHUB_WORKSPACE/KernelSU/kernel/core/init.c"
          grep -q 'CMD_SUSFS_SHOW_VERSION' "$GITHUB_WORKSPACE/KernelSU/kernel/supercall/supercall.c"
          grep -q 'copy_flags |= CL_COPY_MNT_NS;' fs/namespace.c
          grep -q 'linux/susfs_def.h' fs/stat.c
          echo "KSUN v3.4.0 + SUSFS v2.4.0 source integration preflight passed."
