name: Build A13VE Kernel - SukiSU Nova + KPM + SUSFS

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build_kernel_a13ve_oneui17.yml'
      - 'Profiles/a13ve_oneui17.env'
      - 'Patches/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project files
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required A13VE files
        shell: bash
        run: |
          set -euo pipefail
          test -s Profiles/a13ve_oneui17.env
          test -s Patches/Patch/50_add_susfs_in_kernel-4.19.patch
          test -s Patches/normal_patches.sh
          test -s Patches/syscall_hook_patches.sh
          test -s Patches/backport_patches.sh
          test -s Patches/found_gcc.sh
          test -s Patches/check_error.sh
          test -s Patches/Rekernel/rekernel-4.19.patch
          test -s Patches/port_susfs_mount_ids.py
          test -s Patches/susfs_nova_compat.py
          echo "All required A13VE build inputs exist."

      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          command -v patch
          for script in Patches/*.sh; do
            bash -n "$script"
            echo "Shell syntax OK: $script"
          done

  build:
    name: Build A13VE kernel
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      KERNEL_REPO: https://github.com/AlfCraft07/android_kernel_samsung_mt6768-k419.git
      KERNEL_BRANCH: legion-mt6768
      # Pin Nova's manual-hook branch for legacy non-GKI kernels.
      KSU_REPO: https://github.com/SukiSU-Nova/SukiSU-Nova.git
      KSU_BRANCH: builtin
      KSU_COMMIT: 4bec532dd447e2852aa8932afa768255350c103a
      SUSFS_BASE_URL: https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.19/kernel_patches
      DEFCONFIG: a13ve_defconfig
      JOBS: 4

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git curl wget zip unzip bc bison flex \
            build-essential ccache libssl-dev libelf-dev python3 python-is-python3 \
            dwarves device-tree-compiler rsync lld llvm clang \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Clone A13VE kernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          test -s "kernel/arch/arm64/configs/$DEFCONFIG"
          git -C kernel log -1 --oneline

      - name: Install Proton Clang
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain
          test -x toolchain/bin/clang
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"
          toolchain/bin/clang --version

      - name: Integrate pinned SukiSU Nova builtin branch
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --branch "$KSU_BRANCH" "$KSU_REPO" KernelSU
          git -C KernelSU fetch --depth=1 origin "$KSU_COMMIT"
          git -C KernelSU checkout --detach "$KSU_COMMIT"
          test "$(git -C KernelSU rev-parse HEAD)" = "$KSU_COMMIT"

          # Nova builtin is the manual-hook branch and carries SUSFS/KPM Kconfig.
          test -s KernelSU/kernel/Kconfig
          test -s KernelSU/kernel/Makefile
          test -s KernelSU/kernel/ksu_main.c
          test -s KernelSU/kernel/feature/sucompat.c
          test -s KernelSU/kernel/kernel_compat.h
          grep -q '^config KSU_SUSFS$' KernelSU/kernel/Kconfig
          grep -q '^config KPM$' KernelSU/kernel/Kconfig
          grep -q 'susfs_init();' KernelSU/kernel/ksu_main.c
          grep -q 'KSU_CAN_USE_KPM' KernelSU/kernel/kernel_compat.h

          mkdir -p drivers
          ln -s "$(realpath --relative-to="$PWD/drivers" "$PWD/KernelSU/kernel")" drivers/kernelsu
          grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          python3 - <<'PY'
          from pathlib import Path
          p = Path("drivers/Kconfig")
          s = p.read_text()
          entry = 'source "drivers/kernelsu/Kconfig"'
          if entry not in s:
              pos = s.rfind("endmenu")
              if pos < 0:
                  raise SystemExit("drivers/Kconfig has no closing endmenu anchor")
              s = s[:pos] + entry + "\n" + s[pos:]
              p.write_text(s)
          if s.count(entry) != 1:
              raise SystemExit("drivers/kernelsu Kconfig entry must occur exactly once")
          PY

          test -L drivers/kernelsu
          test -s drivers/kernelsu/Kconfig
          test -s drivers/kernelsu/Makefile
          grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "Integrated SukiSU Nova commit: $(git -C KernelSU rev-parse HEAD)"
          echo "Nova builtin manual hooks selected for Linux 4.19."

      - name: Remove unavailable static_call header on Linux 4.19
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          test -f KernelSU/kernel/kernel_includes.h
          grep -Fq static_call.h KernelSU/kernel/kernel_includes.h
          sed -i /static_call.h/d KernelSU/kernel/kernel_includes.h
          ! grep -Fq static_call.h KernelSU/kernel/kernel_includes.h
          echo Removed-unused-static_call-header-for-Linux-4.19
      - name: Fix SukiSU Nova KPM and SUSFS headers for Linux 4.19
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          kpm = Path("KernelSU/kernel/extension/kpm/kpm.c")
          src = kpm.read_text()
          old = "if (!access_ok(u64_to_user_ptr(cmd.result_code), sizeof(result))) return -EFAULT;"
          new = """#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)
              if (!access_ok(VERIFY_WRITE, u64_to_user_ptr(cmd.result_code), sizeof(result))) return -EFAULT;
          #else
              if (!access_ok(u64_to_user_ptr(cmd.result_code), sizeof(result))) return -EFAULT;
          #endif"""
          if src.count(old) != 1:
              raise SystemExit(f"KPM access_ok anchor expected once, found {src.count(old)}")
          src = src.replace(old, new, 1)
          if "#include <linux/version.h>" not in src:
              src = src.replace("#include <linux/uaccess.h>", "#include <linux/uaccess.h>\n#include <linux/version.h>", 1)
          kpm.write_text(src)

          # dispatch.c is a unity-build fragment included by ksu_main.c.
          # Put SUSFS headers in the common header instead of prepending them
          # to the fragment, so declarations remain at file scope.
          common = Path("KernelSU/kernel/kernel_includes.h")
          common_src = common.read_text()
          marker = "#include <linux/version.h>"
          if common_src.count(marker) != 1:
              raise SystemExit(f"kernel_includes.h version include anchor expected once, found {common_src.count(marker)}")
          required_headers = [
              "#include <linux/susfs.h>",
              "#include <linux/susfs_def.h>",
          ]
          for header in required_headers:
              if header not in common_src:
                  common_src = common_src.replace(marker, marker + "\n" + header, 1)
          common.write_text(common_src)

          if "access_ok(VERIFY_WRITE, u64_to_user_ptr(cmd.result_code), sizeof(result))" not in kpm.read_text():
              raise SystemExit("Linux 4.19 KPM access_ok compatibility check failed")
          for header in required_headers:
              if header not in common.read_text():
                  raise SystemExit(f"SUSFS common-header include check failed: {header}")
          print("Applied Linux 4.19 KPM compatibility and file-scope SUSFS headers.")
          PY
      - name: Download SUSFS 4.19 source files
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fs include/linux
          curl -fL "$SUSFS_BASE_URL/fs/susfs.c" -o fs/susfs.c
          curl -fL "$SUSFS_BASE_URL/include/linux/susfs.h" -o include/linux/susfs.h
          curl -fL "$SUSFS_BASE_URL/include/linux/susfs_def.h" -o include/linux/susfs_def.h
          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h
          # Validate the legacy non-GKI 4.19 interface used by Nova builtin.
          # SUSFS 1.5.5 intentionally has no SUSFS_MAGIC, SUS_MAP, or v2.x AVC command.
          grep -Fq '#define SUSFS_VERSION "v1.5.5"' include/linux/susfs.h
          for symbol in CMD_SUSFS_ADD_SUS_PATH CMD_SUSFS_ADD_SUS_MOUNT CMD_SUSFS_ADD_SUS_KSTAT CMD_SUSFS_SET_UNAME CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG CMD_SUSFS_SHOW_VERSION; do
            if ! grep -Eq "(^|[^[:alnum:]_])${symbol}([^[:alnum:]_]|$)" include/linux/susfs_def.h; then
              echo "Missing SUSFS 1.5.5 interface symbol: ${symbol}"
              grep -nE 'CMD_SUSFS_' include/linux/susfs_def.h || true
              exit 1
            fi
          done

      - name: Apply SUSFS base patch
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/Patches/Patch/50_add_susfs_in_kernel-4.19.patch"
          echo "Checking SUSFS base patch against the selected Legion 4.19 source..."
          patch --dry-run --batch --forward --fuzz=3 -p1 < "$patch"
          echo "Applying SUSFS base patch with bounded context fuzz (maximum 3 lines)..."
          patch --batch --forward --fuzz=3 -p1 < "$patch"

      - name: Port SUSFS mount IDs for Legion Linux 4.19
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/Patches/port_susfs_mount_ids.py"

      - name: Add SukiSU Nova compatibility for legacy SUSFS 4.19
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/Patches/susfs_nova_compat.py"

      - name: Configure A13VE kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          clang --version
          command -v aarch64-linux-gnu-ld
          mkdir -p out
          make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- "$DEFCONFIG"
          scripts/config --file out/.config \
            --enable ARM64 \
            --enable 64BIT \
            --enable KSU \
            --enable KSU_SUSFS \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable KPROBES \
            --enable KRETPROBES \
            --enable EXT4_FS \
            --enable KPM
          scripts/config --file out/.config --disable KSU_SUSFS_SUS_MAP
          scripts/config --file out/.config --disable KSU_SUSFS_PRIORITY_UID_FILTER
          make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^CONFIG_KPM=y$' out/.config
          grep -q '^CONFIG_KALLSYMS=y$' out/.config
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config
          grep -q 'KSU_CAN_USE_KPM' drivers/kernelsu/kernel_compat.h
          grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KPM|CONFIG_KALLSYMS|CONFIG_KALLSYMS_ALL|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_EXT4_FS)=' out/.config

      - name: Build kernel Image.gz
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export KCFLAGS=-w
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          make -s O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j"$JOBS"
          test -s out/arch/arm64/boot/Image.gz
          gzip -t out/arch/arm64/boot/Image.gz

      - name: Prepare AnyKernel3 package
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz

          cat > AnyKernel3/anykernel.sh <<'AK'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers
          # Edit by @physwizz Generic
          ## AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=Legion Kernel for mt6768 - A13VE - SukiSU Nova - SUSFS v1.5.5
          do.devicecheck=0
          do.modules=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=a13ve
          device.name2=SM-A137F
          supported.versions=
          '; } # end properties

          # Use the same proven boot-image flow as TouchGrass Kernel v0.4.
          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;

          ## AnyKernel methods (DO NOT CHANGE)
          . tools/ak3-core.sh;

          ui_print "- Unpacking boot image";
          dump_boot;

          mount /system/
          mount /system_root/

          ui_print "- Installing new boot image";
          write_boot;

          ui_print "- Done";
          ui_print " ";
          ## end install
          AK
          chmod 0755 AnyKernel3/anykernel.sh

          # Validate the kernel image and the exact installer that will ship.
          test -s AnyKernel3/Image.gz
          gzip -t AnyKernel3/Image.gz
          sh -n AnyKernel3/anykernel.sh
          (cd AnyKernel3 && zip -r9 "$GITHUB_WORKSPACE/A13VE-SukiSU-Nova-SUSFS.zip" . -x "*.git*" "*.github*")
          test -s A13VE-SukiSU-Nova-SUSFS.zip
          unzip -t A13VE-SukiSU-Nova-SUSFS.zip
          unzip -p A13VE-SukiSU-Nova-SUSFS.zip anykernel.sh > "$RUNNER_TEMP/packaged-anykernel.sh"
          sh -n "$RUNNER_TEMP/packaged-anykernel.sh"
          grep -qF '. tools/ak3-core.sh' "$RUNNER_TEMP/packaged-anykernel.sh"
          grep -qF 'block=/dev/block/by-name/boot;' "$RUNNER_TEMP/packaged-anykernel.sh"
          grep -qF 'dump_boot;' "$RUNNER_TEMP/packaged-anykernel.sh"
          grep -qF 'write_boot;' "$RUNNER_TEMP/packaged-anykernel.sh"
          ! grep -qE '(^|[[:space:]])(BLOCK=|split_boot|flash_boot)' "$RUNNER_TEMP/packaged-anykernel.sh"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A13VE-SukiSU-Nova-SUSFS
          path: |
            A13VE-SukiSU-Nova-SUSFS.zip
            kernel/out/arch/arm64/boot/Image.gz
          if-no-files-found: error
 out/.config
          ! grep -q '^CONFIG_KSU_SUSFS_SUS_MAP=y          grep -q '^CONFIG_KALLSYMS=y$' out/.config
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config
          grep -q 'KSU_CAN_USE_KPM' drivers/kernelsu/kernel_compat.h
          grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KPM|CONFIG_KALLSYMS|CONFIG_KALLSYMS_ALL|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_EXT4_FS)=' out/.config

      - name: Build kernel Image.gz
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export KCFLAGS=-w
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          make -s O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j"$JOBS"
