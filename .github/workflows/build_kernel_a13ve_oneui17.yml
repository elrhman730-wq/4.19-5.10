name: Build A13VE Kernel - SukiSU Ultra + SUSFS

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build_kernel_a13ve_oneui17.yml'
      - 'Profiles/a13ve_oneui17.env'
      - 'Patches/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project files
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required A13VE files
        shell: bash
        run: |
          set -euo pipefail
          test -s Profiles/a13ve_oneui17.env
          test -s Patches/Patch/50_add_susfs_in_kernel-4.19.patch
          test -s Patches/Patch/susfs_upgrade_to_157.patch
          test -s Patches/normal_patches.sh
          test -s Patches/syscall_hook_patches.sh
          test -s Patches/backport_patches.sh
          test -s Patches/found_gcc.sh
          test -s Patches/check_error.sh
          test -s Patches/Rekernel/rekernel-4.19.patch
          echo "All required A13VE build inputs exist."

      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          command -v patch
          for script in Patches/*.sh; do
            bash -n "$script"
            echo "Shell syntax OK: $script"
          done

      - name: Enforce KPM exclusion
        shell: bash
        run: |
          set -euo pipefail
          # The actual kernel .config is checked after olddefconfig below.
          # Do not grep this workflow for the test expression itself.
          if grep -nE -- '--enable[[:space:]]+KPM([[:space:]]|$)'             .github/workflows/build_kernel_a13ve_oneui17.yml | grep -v 'grep -nE'; then
            echo "KPM enablement found in the build command." >&2
            exit 1
          fi
          if grep -nE '^KPM_ENABLE=true$|^KPM_PATCH_SOURCE=' Profiles/a13ve_oneui17.env; then
            echo "KPM must remain disabled in the A13VE profile." >&2
            exit 1
          fi
          echo "KPM is excluded from the A13VE build."

  build:
    name: Build A13VE kernel
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      KERNEL_REPO: https://github.com/AlfCraft07/android_kernel_samsung_mt6768-k419.git
      KERNEL_BRANCH: legion-mt6768
      KSU_SETUP: https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh
      KSU_BRANCH: builtin
      SUSFS_BASE_URL: https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.19/kernel_patches
      DEFCONFIG: a13ve_defconfig
      JOBS: 4

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git curl wget zip unzip bc bison flex \
            build-essential ccache libssl-dev libelf-dev python3 python-is-python3 \
            dwarves device-tree-compiler rsync lld llvm clang \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Clone A13VE kernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          test -s "kernel/arch/arm64/configs/$DEFCONFIG"
          git -C kernel log -1 --oneline

      - name: Install Proton Clang
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain
          test -x toolchain/bin/clang
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"
          toolchain/bin/clang --version

      - name: Integrate SukiSU Ultra builtin
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "$KSU_SETUP" -o /tmp/sukisu-setup.sh
          test -s /tmp/sukisu-setup.sh
          bash /tmp/sukisu-setup.sh "$KSU_BRANCH"
          test -d KernelSU
          test -f KernelSU/kernel/Kconfig
          test -L drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

      - name: Apply non-GKI SukiSU hook integration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/Patches/normal_patches.sh"

      - name: Download SUSFS 4.19 source files
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fs include/linux
          curl -fL "$SUSFS_BASE_URL/fs/susfs.c" -o fs/susfs.c
          curl -fL "$SUSFS_BASE_URL/include/linux/susfs.h" -o include/linux/susfs.h
          curl -fL "$SUSFS_BASE_URL/include/linux/susfs_def.h" -o include/linux/susfs_def.h
          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h

      - name: Apply SUSFS base patch
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/Patches/Patch/50_add_susfs_in_kernel-4.19.patch"
          echo "Checking SUSFS base patch against the selected Legion 4.19 source..."
          patch --dry-run --batch --forward --fuzz=3 -p1 < "$patch"
          echo "Applying SUSFS base patch with bounded context fuzz (maximum 3 lines)..."
          patch --batch --forward --fuzz=3 -p1 < "$patch"

      - name: Upgrade SUSFS to v1.5.7
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/Patches/Patch/susfs_upgrade_to_157.patch"
          echo "Checking SUSFS v1.5.7 upgrade patch..."
          patch --dry-run --batch --forward --fuzz=3 -p1 < "$patch"
          echo "Applying SUSFS v1.5.7 upgrade patch..."
          patch --batch --forward --fuzz=3 -p1 < "$patch"
          grep -q 'SUSFS_VERSION "v1.5.7"' include/linux/susfs.h

      - name: Configure A13VE kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          make O=out ARCH=arm64 "$DEFCONFIG"
          scripts/config --file out/.config \
            --enable ARM64 \
            --enable 64BIT \
            --enable KSU \
            --enable KSU_SUSFS \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable KPROBES \
            --enable KRETPROBES \
            --enable EXT4_FS \
            --disable KPM
          make O=out ARCH=arm64 olddefconfig
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^CONFIG_KALLSYMS=y$' out/.config
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config
          if grep -q '^CONFIG_KPM=y$' out/.config; then
            echo "KPM unexpectedly enabled." >&2
            exit 1
          fi
          grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KALLSYMS|CONFIG_KALLSYMS_ALL|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_EXT4_FS)=' out/.config

      - name: Build kernel Image.gz
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export KCFLAGS=-w
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          make -s O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j"$JOBS"
          test -s out/arch/arm64/boot/Image.gz
          gzip -t out/arch/arm64/boot/Image.gz

      - name: Prepare AnyKernel3 package
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          cat > AnyKernel3/anykernel.sh <<'AK'
          #!/sbin/sh
          properties() { '
          kernel.string=Legion Kernel for mt6768 - A13VE - SukiSU Ultra - SUSFS v1.5.7
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=a13ve
          device.name2=SM-A137F
          '; }
          block=/dev/block/by-name/boot
          is_slot_device=0
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          . tools/ak3-core.sh
          split_boot
          flash_boot
          AK
          chmod 0755 AnyKernel3/anykernel.sh
          (cd AnyKernel3 && zip -r9 "$GITHUB_WORKSPACE/A13VE-SukiSU-Ultra-SUSFS.zip" . -x "*.git*" "*.github*")
          test -s A13VE-SukiSU-Ultra-SUSFS.zip
          unzip -t A13VE-SukiSU-Ultra-SUSFS.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A13VE-SukiSU-Ultra-SUSFS
          path: |
            A13VE-SukiSU-Ultra-SUSFS.zip
            kernel/out/arch/arm64/boot/Image.gz
          if-no-files-found: error
