name: Build A13VE Kernel - SukiSU Ultra + SUSFS

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build_kernel_a13ve_oneui17.yml'
      - 'Profiles/a13ve_oneui17.env'
      - 'Patches/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project files
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required A13VE files
        shell: bash
        run: |
          set -euo pipefail
          test -s Profiles/a13ve_oneui17.env
          test -s Patches/Patch/50_add_susfs_in_kernel-4.19.patch
          test -s Patches/Patch/susfs_upgrade_to_157.patch
          test -s Patches/normal_patches.sh
          test -s Patches/syscall_hook_patches.sh
          test -s Patches/backport_patches.sh
          test -s Patches/found_gcc.sh
          test -s Patches/check_error.sh
          test -s Patches/Rekernel/rekernel-4.19.patch
          echo "All required A13VE build inputs exist."

      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          command -v patch
          for script in Patches/*.sh; do
            bash -n "$script"
            echo "Shell syntax OK: $script"
          done

      - name: Enforce KPM exclusion
        shell: bash
        run: |
          set -euo pipefail
          # The actual kernel .config is checked after olddefconfig below.
          # Do not grep this workflow for the test expression itself.
          if grep -nE -- '--enable[[:space:]]+KPM([[:space:]]|$)'             .github/workflows/build_kernel_a13ve_oneui17.yml | grep -v 'grep -nE'; then
            echo "KPM enablement found in the build command." >&2
            exit 1
          fi
          if grep -nE '^KPM_ENABLE=true$|^KPM_PATCH_SOURCE=' Profiles/a13ve_oneui17.env; then
            echo "KPM must remain disabled in the A13VE profile." >&2
            exit 1
          fi
          echo "KPM is excluded from the A13VE build."

  build:
    name: Build A13VE kernel
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      KERNEL_REPO: https://github.com/AlfCraft07/android_kernel_samsung_mt6768-k419.git
      KERNEL_BRANCH: legion-mt6768
      KSU_SETUP: https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh
      KSU_BRANCH: builtin
      SUSFS_BASE_URL: https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.19/kernel_patches
      DEFCONFIG: a13ve_defconfig
      JOBS: 4

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git curl wget zip unzip bc bison flex \
            build-essential ccache libssl-dev libelf-dev python3 python-is-python3 \
            dwarves device-tree-compiler rsync lld llvm clang \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Clone A13VE kernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          test -s "kernel/arch/arm64/configs/$DEFCONFIG"
          git -C kernel log -1 --oneline

      - name: Install Proton Clang
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain
          test -x toolchain/bin/clang
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"
          toolchain/bin/clang --version

      - name: Integrate SukiSU Ultra builtin
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "$KSU_SETUP" -o /tmp/sukisu-setup.sh
          test -s /tmp/sukisu-setup.sh
          bash /tmp/sukisu-setup.sh "$KSU_BRANCH"
          test -d KernelSU
          test -f KernelSU/kernel/Kconfig
          test -L drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

      - name: Apply non-GKI SukiSU hook integration
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/Patches/normal_patches.sh"

      - name: Download SUSFS 4.19 source files
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fs include/linux
          curl -fL "$SUSFS_BASE_URL/fs/susfs.c" -o fs/susfs.c
          curl -fL "$SUSFS_BASE_URL/include/linux/susfs.h" -o include/linux/susfs.h
          curl -fL "$SUSFS_BASE_URL/include/linux/susfs_def.h" -o include/linux/susfs_def.h
          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h

      - name: Apply SUSFS base patch
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/Patches/Patch/50_add_susfs_in_kernel-4.19.patch"
          echo "Checking SUSFS base patch against the selected Legion 4.19 source..."
          patch --dry-run --batch --forward --fuzz=3 -p1 < "$patch"
          echo "Applying SUSFS base patch with bounded context fuzz (maximum 3 lines)..."
          patch --batch --forward --fuzz=3 -p1 < "$patch"

      - name: Upgrade SUSFS to v1.5.7 (Legion KDP_NS-aware port)
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("fs/namespace.c")
          source = path.read_text()

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              source = source.replace(old, new, 1)

          # v1.5.7 no longer uses the extra zygote-copy flag.
          replace_once(
              "#define CL_ZYGOTE_COPY_MNT_NS BIT(24) /* used by copy_mnt_ns() */\n",
              "",
              "remove obsolete zygote namespace flag",
          )

          # Add the v1.5.7 namespace walk variables to clone_mnt().
          replace_once(
              "static struct mount *clone_mnt(struct mount *old, struct dentry *root,\n"
              "\t\t\t\t\tint flag)\n"
              "{\n"
              "#ifdef CONFIG_KDP_NS\n"
              "\tint ns_flags;\n"
              "\tstruct super_block *sb = old->mnt->mnt_sb;\n"
              "#else\n"
              "\tstruct super_block *sb = old->mnt.mnt_sb;\n"
              "#endif\n"
              "\tstruct mount *mnt;\n"
              "\tint err;\n",
              "static struct mount *clone_mnt(struct mount *old, struct dentry *root,\n"
              "\t\t\t\t\tint flag)\n"
              "{\n"
              "#ifdef CONFIG_KDP_NS\n"
              "\tint ns_flags;\n"
              "\tstruct super_block *sb = old->mnt->mnt_sb;\n"
              "#else\n"
              "\tstruct super_block *sb = old->mnt.mnt_sb;\n"
              "#endif\n"
              "\tstruct mount *mnt;\n"
              "\tint err;\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\tstruct mount *m;\n"
              "\tstruct mnt_namespace *mnt_ns;\n"
              "\tint mnt_id;\n"
              "#endif\n",
              "add clone_mnt v1.5.7 variables",
          )

          # The base patch's clone_mnt hunk can vary in whitespace across the Legion tree.
          # Match the semantic zygote/unshare region, not its explanatory comments.
          import re
          clone_pattern = re.compile(
              r"(?ms)^\\t// Secondly, check if it is zygote process.*?"
              r"(?=^\\tmnt = alloc_vfsmnt\\(old->mnt_devname, false, 0\\);)"
          )
          clone_matches = list(clone_pattern.finditer(source))
          if len(clone_matches) != 1:
              raise SystemExit(
                  "port clone_mnt SUSFS mount handling: expected one zygote/unshare region, "
                  f"found {len(clone_matches)}"
              )
          new_zygote_clone = (
              "\\t// Lastly, just check if old->mnt_id is sus.\\n"
              "\\tif (old->mnt_id >= DEFAULT_SUS_MNT_ID) {\\n"
              "\\t\\tmnt = alloc_vfsmnt(old->mnt_devname, true, 0);\\n"
              "\\t\\tgoto bypass_orig_flow;\\n"
              "\\t}\\n"
          )
          source = clone_pattern.sub(lambda _: new_zygote_clone, source, count=1)


          old_fake_id = (
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\t// If caller process is zygote and not doing unshare, so we just reorder the mnt_id\n"
              "\tif (likely(is_current_zygote_domain) && !(flag & CL_ZYGOTE_COPY_MNT_NS)) {\n"
              "\t\tmnt->mnt.susfs_mnt_id_backup = mnt->mnt_id;\n"
              "\t\tmnt->mnt_id = current->susfs_last_fake_mnt_id++;\n"
              "\t}\n"
              "#endif\n"
          )
          new_fake_id = (
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\t// Allocate the next available fake mount ID in the current namespace.\n"
              "\tif (likely(is_current_zygote_domain) && !(flag & CL_COPY_MNT_NS)) {\n"
              "\t\tmnt_ns = current->nsproxy->mnt_ns;\n"
              "\t\tif (mnt_ns) {\n"
              "\t\t\tget_mnt_ns(mnt_ns);\n"
              "\t\t\trcu_read_lock();\n"
              "\t\t\tmnt_id = list_first_entry(&mnt_ns->list, struct mount, mnt_list)->mnt_id;\n"
              "\t\t\tlist_for_each_entry_rcu(m, &mnt_ns->list, mnt_list) {\n"
              "\t\t\t\tif (m->mnt_id < DEFAULT_SUS_MNT_ID)\n"
              "\t\t\t\t\tmnt_id++;\n"
              "\t\t\t}\n"
              "\t\t\tWRITE_ONCE(mnt->mnt.susfs_mnt_id_backup, READ_ONCE(mnt->mnt_id));\n"
              "\t\t\tWRITE_ONCE(mnt->mnt_id, READ_ONCE(mnt_id));\n"
              "\t\t\trcu_read_unlock();\n"
              "\t\t\tput_mnt_ns(mnt_ns);\n"
              "\t\t}\n"
              "\t}\n"
              "#endif\n"
          )
          replace_once(old_fake_id, new_fake_id, "replace legacy clone_mnt fake-ID counter")

          # copy_tree() needs to account for clones before they are attached to mnt_ns->list.
          replace_once(
              "struct mount *copy_tree(struct mount *mnt, struct dentry *dentry,\n"
              "\t\t\t\t\tint flag)\n"
              "{\n"
              "\tstruct mount *res, *p, *q, *r, *parent;\n",
              "struct mount *copy_tree(struct mount *mnt, struct dentry *dentry,\n"
              "\t\t\t\t\tint flag)\n"
              "{\n"
              "\tstruct mount *res, *p, *q, *r, *parent;\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\tbool is_current_zygote_domain = susfs_is_current_zygote_domain();\n"
              "#endif\n",
              "add copy_tree zygote state",
          )
          replace_once(
              "\tlist_for_each_entry(r, &mnt->mnt_mounts, mnt_child) {\n"
              "\t\tstruct mount *s;\n",
              "\tlist_for_each_entry(r, &mnt->mnt_mounts, mnt_child) {\n"
              "\t\tstruct mount *s;\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\t\tint attach_mnt_count = 0;\n"
              "#endif\n",
              "add copy_tree attach counter",
          )
          replace_once(
              "\t\t\tif (IS_ERR(q))\n"
              "\t\t\t\tgoto out;\n"
              "\t\t\tlock_mount_hash();\n",
              "\t\t\tif (IS_ERR(q))\n"
              "\t\t\t\tgoto out;\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\t\t\tif (is_current_zygote_domain &&\n"
              "\t\t\t\t!(flag & CL_COPY_MNT_NS) &&\n"
              "\t\t\t\tq->mnt_id < DEFAULT_SUS_MNT_ID) {\n"
              "\t\t\t\tattach_mnt_count++;\n"
              "\t\t\t\tq->mnt_id += attach_mnt_count;\n"
              "\t\t\t}\n"
              "#endif\n"
              "\t\t\tlock_mount_hash();\n",
              "add copy_tree pre-attach ID correction",
          )

          # Keep CL_COPY_MNT_NS for copy_mnt_ns(), but remove the obsolete zygote-only flag.
          replace_once(
              "\tcopy_flags |= CL_COPY_MNT_NS;\n"
              "\tif (is_zygote_pid) {\n"
              "\t\t// Let clone_mnt() in copy_tree() know copy_mnt_ns() is run by zygote process\n"
              "\t\tcopy_flags |= CL_ZYGOTE_COPY_MNT_NS;\n"
              "\t}\n",
              "\tcopy_flags |= CL_COPY_MNT_NS;\n",
              "remove zygote-only copy flag",
          )
          replace_once(
              "\t// Assign the 'last_entry_mnt_id' to 'current->susfs_last_fake_mnt_id' for later use.\n"
              "\t// should be fine here assuming zygote is forking/unsharing app in one single thread.\n"
              "\t// Or should we put a lock here?\n"
              "\tcurrent->susfs_last_fake_mnt_id = last_entry_mnt_id;\n",
              "",
              "remove obsolete task fake-ID counter",
          )

          if "CL_ZYGOTE_COPY_MNT_NS" in source:
              raise SystemExit("obsolete CL_ZYGOTE_COPY_MNT_NS reference remains")
          if "current->susfs_last_fake_mnt_id" in source:
              raise SystemExit("obsolete per-task fake mount ID reference remains")
          if source.count("Allocate the next available fake mount ID in the current namespace.") != 1:
              raise SystemExit("v1.5.7 clone_mnt mount-ID algorithm was not installed exactly once")

          path.write_text(source)
          print("SUSFS v1.5.7 namespace logic ported with Legion CONFIG_KDP_NS layout checks.")
          PY

          patch="$GITHUB_WORKSPACE/Patches/Patch/susfs_upgrade_to_157.patch"
          echo "Checking SUSFS v1.5.7 version marker patch..."
          patch --dry-run --batch --forward --fuzz=0 -p1 < "$patch"
          patch --batch --forward --fuzz=0 -p1 < "$patch"
          grep -q 'SUSFS_VERSION "v1.5.7"' include/linux/susfs.h
          ! grep -q 'CL_ZYGOTE_COPY_MNT_NS\|current->susfs_last_fake_mnt_id' fs/namespace.c

      - name: Configure A13VE kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          make O=out ARCH=arm64 "$DEFCONFIG"
          scripts/config --file out/.config \
            --enable ARM64 \
            --enable 64BIT \
            --enable KSU \
            --enable KSU_SUSFS \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable KPROBES \
            --enable KRETPROBES \
            --enable EXT4_FS \
            --disable KPM
          make O=out ARCH=arm64 olddefconfig
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^CONFIG_KALLSYMS=y$' out/.config
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config
          if grep -q '^CONFIG_KPM=y$' out/.config; then
            echo "KPM unexpectedly enabled." >&2
            exit 1
          fi
          grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KALLSYMS|CONFIG_KALLSYMS_ALL|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_EXT4_FS)=' out/.config

      - name: Build kernel Image.gz
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export KCFLAGS=-w
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          make -s O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j"$JOBS"
          test -s out/arch/arm64/boot/Image.gz
          gzip -t out/arch/arm64/boot/Image.gz

      - name: Prepare AnyKernel3 package
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          cat > AnyKernel3/anykernel.sh <<'AK'
          #!/sbin/sh
          properties() { '
          kernel.string=Legion Kernel for mt6768 - A13VE - SukiSU Ultra - SUSFS v1.5.7
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=a13ve
          device.name2=SM-A137F
          '; }
          block=/dev/block/by-name/boot
          is_slot_device=0
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          . tools/ak3-core.sh
          split_boot
          flash_boot
          AK
          chmod 0755 AnyKernel3/anykernel.sh
          (cd AnyKernel3 && zip -r9 "$GITHUB_WORKSPACE/A13VE-SukiSU-Ultra-SUSFS.zip" . -x "*.git*" "*.github*")
          test -s A13VE-SukiSU-Ultra-SUSFS.zip
          unzip -t A13VE-SukiSU-Ultra-SUSFS.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A13VE-SukiSU-Ultra-SUSFS
          path: |
            A13VE-SukiSU-Ultra-SUSFS.zip
            kernel/out/arch/arm64/boot/Image.gz
          if-no-files-found: error
