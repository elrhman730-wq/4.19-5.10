name: Build A13VE Kernel - SukiSU Nova + KPM + SUSFS

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build_kernel_a13ve_oneui17.yml'
      - 'Profiles/a13ve_oneui17.env'
      - 'Patches/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project files
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required A13VE files
        shell: bash
        run: |
          set -euo pipefail
          test -s Profiles/a13ve_oneui17.env
          test -s Patches/Patch/50_add_susfs_in_kernel-4.19.patch
          test -s Patches/Patch/susfs_upgrade_to_157.patch
          test -s Patches/normal_patches.sh
          test -s Patches/syscall_hook_patches.sh
          test -s Patches/backport_patches.sh
          test -s Patches/found_gcc.sh
          test -s Patches/check_error.sh
          test -s Patches/Rekernel/rekernel-4.19.patch
          echo "All required A13VE build inputs exist."

      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          command -v patch
          for script in Patches/*.sh; do
            bash -n "$script"
            echo "Shell syntax OK: $script"
          done

  build:
    name: Build A13VE kernel
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      KERNEL_REPO: https://github.com/AlfCraft07/android_kernel_samsung_mt6768-k419.git
      KERNEL_BRANCH: legion-mt6768
      # Pin Nova's manual-hook branch for legacy non-GKI kernels.
      KSU_REPO: https://github.com/SukiSU-Nova/SukiSU-Nova.git
      KSU_BRANCH: builtin
      KSU_COMMIT: 4bec532dd447e2852aa8932afa768255350c103a
      SUSFS_BASE_URL: https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.19/kernel_patches
      DEFCONFIG: a13ve_defconfig
      JOBS: 4

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git curl wget zip unzip bc bison flex \
            build-essential ccache libssl-dev libelf-dev python3 python-is-python3 \
            dwarves device-tree-compiler rsync lld llvm clang \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Clone A13VE kernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          test -s "kernel/arch/arm64/configs/$DEFCONFIG"
          git -C kernel log -1 --oneline

      - name: Install Proton Clang
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain
          test -x toolchain/bin/clang
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"
          toolchain/bin/clang --version

      - name: Integrate pinned SukiSU Nova builtin branch
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --branch "$KSU_BRANCH" "$KSU_REPO" KernelSU
          git -C KernelSU fetch --depth=1 origin "$KSU_COMMIT"
          git -C KernelSU checkout --detach "$KSU_COMMIT"
          test "$(git -C KernelSU rev-parse HEAD)" = "$KSU_COMMIT"

          # Nova builtin is the manual-hook branch and carries SUSFS/KPM Kconfig.
          test -s KernelSU/kernel/Kconfig
          test -s KernelSU/kernel/Makefile
          test -s KernelSU/kernel/ksu_main.c
          test -s KernelSU/kernel/feature/sucompat.c
          test -s KernelSU/kernel/kernel_compat.h
          grep -q '^config KSU_SUSFS$' KernelSU/kernel/Kconfig
          grep -q '^config KPM$' KernelSU/kernel/Kconfig
          grep -q 'susfs_init();' KernelSU/kernel/ksu_main.c
          grep -q 'KSU_CAN_USE_KPM' KernelSU/kernel/kernel_compat.h

          mkdir -p drivers
          ln -s "$(realpath --relative-to="$PWD/drivers" "$PWD/KernelSU/kernel")" drivers/kernelsu
          grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

          python3 - <<'PY'
          from pathlib import Path
          p = Path("drivers/Kconfig")
          s = p.read_text()
          entry = 'source "drivers/kernelsu/Kconfig"'
          if entry not in s:
              pos = s.rfind("endmenu")
              if pos < 0:
                  raise SystemExit("drivers/Kconfig has no closing endmenu anchor")
              s = s[:pos] + entry + "\n" + s[pos:]
              p.write_text(s)
          if s.count(entry) != 1:
              raise SystemExit("drivers/kernelsu Kconfig entry must occur exactly once")
          PY

          test -L drivers/kernelsu
          test -s drivers/kernelsu/Kconfig
          test -s drivers/kernelsu/Makefile
          grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "Integrated SukiSU Nova commit: $(git -C KernelSU rev-parse HEAD)"
          echo "Nova builtin manual hooks selected for Linux 4.19."

      - name: Download SUSFS 4.19 source files
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fs include/linux
          curl -fL "$SUSFS_BASE_URL/fs/susfs.c" -o fs/susfs.c
          curl -fL "$SUSFS_BASE_URL/include/linux/susfs.h" -o include/linux/susfs.h
          curl -fL "$SUSFS_BASE_URL/include/linux/susfs_def.h" -o include/linux/susfs_def.h
          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h

      - name: Apply SUSFS base patch
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/Patches/Patch/50_add_susfs_in_kernel-4.19.patch"
          echo "Checking SUSFS base patch against the selected Legion 4.19 source..."
          patch --dry-run --batch --forward --fuzz=3 -p1 < "$patch"
          echo "Applying SUSFS base patch with bounded context fuzz (maximum 3 lines)..."
          patch --batch --forward --fuzz=3 -p1 < "$patch"

      - name: Upgrade SUSFS to v1.5.7 (Legion KDP_NS-aware port)
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("fs/namespace.c")
          source = path.read_text()

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              source = source.replace(old, new, 1)

          # v1.5.7 no longer uses the extra zygote-copy flag.
          replace_once(
              "#define CL_ZYGOTE_COPY_MNT_NS BIT(24) /* used by copy_mnt_ns() */\n",
              "",
              "remove obsolete zygote namespace flag",
          )

          # Add the v1.5.7 namespace walk variables to clone_mnt().
          replace_once(
              "static struct mount *clone_mnt(struct mount *old, struct dentry *root,\n"
              "\t\t\t\t\tint flag)\n"
              "{\n"
              "#ifdef CONFIG_KDP_NS\n"
              "\tint ns_flags;\n"
              "\tstruct super_block *sb = old->mnt->mnt_sb;\n"
              "#else\n"
              "\tstruct super_block *sb = old->mnt.mnt_sb;\n"
              "#endif\n"
              "\tstruct mount *mnt;\n"
              "\tint err;\n",
              "static struct mount *clone_mnt(struct mount *old, struct dentry *root,\n"
              "\t\t\t\t\tint flag)\n"
              "{\n"
              "#ifdef CONFIG_KDP_NS\n"
              "\tint ns_flags;\n"
              "\tstruct super_block *sb = old->mnt->mnt_sb;\n"
              "#else\n"
              "\tstruct super_block *sb = old->mnt.mnt_sb;\n"
              "#endif\n"
              "\tstruct mount *mnt;\n"
              "\tint err;\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\tstruct mount *m;\n"
              "\tstruct mnt_namespace *mnt_ns;\n"
              "\tint mnt_id;\n"
              "#endif\n",
              "add clone_mnt v1.5.7 variables",
          )

          # Port clone_mnt by anchoring the edit inside the actual function.
          # Legion's base patch can leave the original one-argument allocator call
          # in place because its surrounding source differs from upstream SUSFS.
          clone_start = source.index("static struct mount *clone_mnt(")
          clone_end = source.index("\nstatic void cleanup_mnt(", clone_start)
          clone_func = source[clone_start:clone_end]
          old_alloc = "\tmnt = alloc_vfsmnt(old->mnt_devname);\n"
          if clone_func.count(old_alloc) == 1:
              new_alloc = (
                  "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\t/* Route mount clones through SUSFS-aware mount-ID allocation. */\n"
                  "\tif (unlikely(is_current_ksu_domain)) {\n"
                  "\t\tif (!(flag & CL_COPY_MNT_NS)) {\n"
                  "\t\t\tmnt = alloc_vfsmnt(old->mnt_devname, true, 0);\n"
                  "\t\t} else {\n"
                  "\t\t\tmnt = alloc_vfsmnt(old->mnt_devname, true, old->mnt_id);\n"
                  "\t\t\tif (mnt)\n"
                  "\t\t\t\tmnt->mnt.susfs_mnt_id_backup = DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE;\n"
                  "\t\t}\n"
                  "\t} else if (likely(is_current_zygote_domain) && (old->mnt_id >= DEFAULT_SUS_MNT_ID)) {\n"
                  "\t\tmnt = alloc_vfsmnt(old->mnt_devname, true, 0);\n"
                  "\t} else if ((flag & CL_COPY_MNT_NS) && (old->mnt_id >= DEFAULT_SUS_MNT_ID)) {\n"
                  "\t\tmnt = alloc_vfsmnt(old->mnt_devname, true, 0);\n"
                  "\t} else {\n"
                  "\t\tmnt = alloc_vfsmnt(old->mnt_devname, false, 0);\n"
                  "\t}\n"
                  "#else\n"
                  "\tmnt = alloc_vfsmnt(old->mnt_devname);\n"
                  "#endif\n"
              )
              clone_func = clone_func.replace(old_alloc, new_alloc, 1)
              source = source[:clone_start] + clone_func + source[clone_end:]
          elif "alloc_vfsmnt(old->mnt_devname, false, 0);" not in clone_func:
              raise SystemExit(
                  "clone_mnt allocator port: expected original one-argument call or an already-ported v1.5.7 call"
              )
          if "struct mount *m;" not in clone_func:
              raise SystemExit("clone_mnt v1.5.7 namespace-walk declarations are missing")
          if "struct mnt_namespace *mnt_ns;" not in clone_func:
              raise SystemExit("clone_mnt v1.5.7 namespace-walk declarations are missing")
          if "int mnt_id;" not in clone_func:
              raise SystemExit("clone_mnt v1.5.7 namespace-walk declarations are missing")

          # Keep the legacy one-argument allocator API for the rest of 4.19.
          # SUSFS-specific callers use a dedicated helper with explicit ID policy.
          source = source.replace(
              "static struct mount *alloc_vfsmnt(const char *name, bool should_spoof, int custom_mnt_id)",
              "static struct mount *alloc_vfsmnt_susfs(const char *name, bool should_spoof, int custom_mnt_id)",
          )
          source = source.replace(
              "static struct mount *alloc_vfsmnt(const char *name)\n#endif",
              "static struct mount *alloc_vfsmnt_susfs(const char *name)\n#endif",
          )
          # Convert only the explicit three-argument SUSFS allocation calls.
          source = re.sub(
              r"\balloc_vfsmnt\(([^\n;]*?),\s*(true|false),\s*([^()\n;]*)\)",
              r"alloc_vfsmnt_susfs(\1, \2, \3)",
              source,
          )
          allocator_end = source.index("\n/*\n * Most r/o checks on a fs", source.index("static struct mount *alloc_vfsmnt_susfs("))
          allocator_wrapper = (
              "\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "static struct mount *alloc_vfsmnt(const char *name)\n"
              "{\n"
              "\treturn alloc_vfsmnt_susfs(name, false, 0);\n"
              "}\n"
              "#else\n"
              "#define alloc_vfsmnt alloc_vfsmnt_susfs\n"
              "#endif\n"
          )
          source = source[:allocator_end] + allocator_wrapper + source[allocator_end:]

          # The base patch's old fake-ID implementation was accidentally attached
          # to vfs_create_mount(). Keep its SUSFS-aware allocator selection, but
          # remove clone-only namespace-walk locals/logic from that function.
          vfs_start = source.index("struct vfsmount *vfs_create_mount(")
          vfs_end = source.index("\nEXPORT_SYMBOL(vfs_create_mount);", vfs_start)
          vfs_func = source[vfs_start:vfs_end]
          vfs_func = vfs_func.replace(
              "\tstruct mount *m;\n\tstruct mnt_namespace *mnt_ns;\n\tint mnt_id;\n", ""
          )
          vfs_func = re.sub(
              r"(?ms)^\s*// Calculate the next available fake mount ID in the current namespace\..*?^#endif\n",
              "",
              vfs_func,
          )
          # The legacy 4.19 allocator API is kept for ordinary mounts; only
          # KernelSU-domain mounts request a SUSFS fake mount ID.
          vfs_alloc = "\tmnt = alloc_vfsmnt(fc->source ?: \"none\");\n"
          vfs_alloc_new = (
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\tif (unlikely(susfs_is_current_ksu_domain()))\n"
              "\t\tmnt = alloc_vfsmnt_susfs(fc->source ?: \"none\", true, 0);\n"
              "\telse\n"
              "\t\tmnt = alloc_vfsmnt(fc->source ?: \"none\");\n"
              "#else\n"
              "\tmnt = alloc_vfsmnt(fc->source ?: \"none\");\n"
              "#endif\n"
          )
          if vfs_func.count(vfs_alloc) != 1:
              raise SystemExit(f"vfs_create_mount allocator anchor: expected one match, found {vfs_func.count(vfs_alloc)}")
          vfs_func = vfs_func.replace(vfs_alloc, vfs_alloc_new, 1)
          source = source[:vfs_start] + vfs_func + source[vfs_end:]

          # Ensure the state predicates belong to clone_mnt(), not a fuzz-matched
          # neighboring function in the legacy base patch.
          clone_start = source.index("static struct mount *clone_mnt(")
          clone_end = source.index("\nstatic void cleanup_mnt(", clone_start)
          clone_func = source[clone_start:clone_end]
          if "bool is_current_ksu_domain = susfs_is_current_ksu_domain();" not in clone_func:
              clone_func = clone_func.replace(
                  "\tint err;\n",
                  "\tint err;\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "\tbool is_current_ksu_domain = susfs_is_current_ksu_domain();\n"
                  "\tbool is_current_zygote_domain = susfs_is_current_zygote_domain();\n"
                  "#endif\n",
                  1,
              )
          source = source[:clone_start] + clone_func + source[clone_end:]

          # The legacy base patch's fake-ID hunk was removed because fuzzed
          # context could place it in vfs_create_mount instead of clone_mnt.
          # Remove any residual legacy block, then install v1.5.7 at a unique
          # anchor inside clone_mnt().
          import re
          legacy_fake = re.compile(
              r"(?ms)^#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              r"\t// If caller process is zygote and not doing unshare,.*?^#endif\n"
          )
          source, legacy_count = legacy_fake.subn("", source)
          if legacy_count > 1:
              raise SystemExit(f"legacy clone_mnt fake-ID block appeared {legacy_count} times")
          clone_start = source.index("static struct mount *clone_mnt(")
          clone_end = source.index("\nstatic void cleanup_mnt(", clone_start)
          clone_func = source[clone_start:clone_end]
          anchor = "\tmnt->mnt_parent = mnt;\n"
          if clone_func.count(anchor) != 1:
              raise SystemExit(
                  f"clone_mnt fake-ID insertion anchor: expected one match, found {clone_func.count(anchor)}"
              )
          new_fake_id = (
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\t/* Allocate the next available fake mount ID in this namespace. */\n"
              "\tif (likely(is_current_zygote_domain) && !(flag & CL_COPY_MNT_NS)) {\n"
              "\t\tmnt_ns = current->nsproxy->mnt_ns;\n"
              "\t\tif (mnt_ns) {\n"
              "\t\t\tget_mnt_ns(mnt_ns);\n"
              "\t\t\trcu_read_lock();\n"
              "\t\t\tmnt_id = list_first_entry(&mnt_ns->list, struct mount, mnt_list)->mnt_id;\n"
              "\t\t\tlist_for_each_entry_rcu(m, &mnt_ns->list, mnt_list) {\n"
              "\t\t\t\tif (m->mnt_id < DEFAULT_SUS_MNT_ID)\n"
              "\t\t\t\t\tmnt_id++;\n"
              "\t\t\t}\n"
              "\t\t\tWRITE_ONCE(mnt->mnt.susfs_mnt_id_backup, READ_ONCE(mnt->mnt_id));\n"
              "\t\t\tWRITE_ONCE(mnt->mnt_id, READ_ONCE(mnt_id));\n"
              "\t\t\trcu_read_unlock();\n"
              "\t\t\tput_mnt_ns(mnt_ns);\n"
              "\t\t}\n"
              "\t}\n"
              "#endif\n"
          )
          clone_func = clone_func.replace(anchor, anchor + new_fake_id, 1)
          source = source[:clone_start] + clone_func + source[clone_end:]

          # copy_tree() needs to account for clones before they are attached to mnt_ns->list.
          replace_once(
              "struct mount *copy_tree(struct mount *mnt, struct dentry *dentry,\n"
              "\t\t\t\t\tint flag)\n"
              "{\n"
              "\tstruct mount *res, *p, *q, *r, *parent;\n",
              "struct mount *copy_tree(struct mount *mnt, struct dentry *dentry,\n"
              "\t\t\t\t\tint flag)\n"
              "{\n"
              "\tstruct mount *res, *p, *q, *r, *parent;\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\tbool is_current_zygote_domain = susfs_is_current_zygote_domain();\n"
              "#endif\n",
              "add copy_tree zygote state",
          )
          replace_once(
              "\tlist_for_each_entry(r, &mnt->mnt_mounts, mnt_child) {\n"
              "\t\tstruct mount *s;\n",
              "\tlist_for_each_entry(r, &mnt->mnt_mounts, mnt_child) {\n"
              "\t\tstruct mount *s;\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\t\tint attach_mnt_count = 0;\n"
              "#endif\n",
              "add copy_tree attach counter",
          )
          replace_once(
              "\t\t\tif (IS_ERR(q))\n"
              "\t\t\t\tgoto out;\n"
              "\t\t\tlock_mount_hash();\n",
              "\t\t\tif (IS_ERR(q))\n"
              "\t\t\t\tgoto out;\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\t\t\tif (is_current_zygote_domain &&\n"
              "\t\t\t\t!(flag & CL_COPY_MNT_NS) &&\n"
              "\t\t\t\tq->mnt_id < DEFAULT_SUS_MNT_ID) {\n"
              "\t\t\t\tattach_mnt_count++;\n"
              "\t\t\t\tq->mnt_id += attach_mnt_count;\n"
              "\t\t\t}\n"
              "#endif\n"
              "\t\t\tlock_mount_hash();\n",
              "add copy_tree pre-attach ID correction",
          )

          # The old SUSFS patch used a zygote-only flag and a per-task fake-ID
          # counter. v1.5.7 uses CL_COPY_MNT_NS only; install it in the real
          # copy_mnt_ns() function, whose Legion body has CONFIG_KDP_NS branches.
          import re
          source = re.sub(
              r"(?ms)^#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              r"\s*// Always let clone_mnt\(\).*?^#endif\n",
              "",
              source,
          )
          source = re.sub(
              r"(?ms)^#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              r"\s*// Assign the 'last_entry_mnt_id'.*?^#endif\n",
              "",
              source,
          )
          copy_start = source.index("struct mnt_namespace *copy_mnt_ns(")
          copy_end = source.index("\n/**\n * create_mnt_ns", copy_start)
          copy_func = source[copy_start:copy_end]
          copy_anchor = (
              "\tif (user_ns != ns->user_ns)\n"
              "\t\tcopy_flags |= CL_SHARED_TO_SLAVE | CL_UNPRIVILEGED;\n"
          )
          if copy_func.count(copy_anchor) != 1:
              raise SystemExit(
                  f"copy_mnt_ns CL_COPY_MNT_NS anchor: expected one match, found {copy_func.count(copy_anchor)}"
              )
          copy_func = copy_func.replace(
              copy_anchor,
              copy_anchor
              + "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              + "\tcopy_flags |= CL_COPY_MNT_NS;\n"
              + "#endif\n",
              1,
          )
          source = source[:copy_start] + copy_func + source[copy_end:]

          if "CL_ZYGOTE_COPY_MNT_NS" in source:
              raise SystemExit("obsolete CL_ZYGOTE_COPY_MNT_NS reference remains")
          if "current->susfs_last_fake_mnt_id" in source:
              raise SystemExit("obsolete per-task fake mount ID reference remains")
          if source.count("Allocate the next available fake mount ID in this namespace.") != 1:
              raise SystemExit("v1.5.7 clone_mnt mount-ID algorithm was not installed exactly once")

          path.write_text(source)
          print("SUSFS v1.5.7 namespace logic ported with Legion CONFIG_KDP_NS layout checks.")
          PY

          patch="$GITHUB_WORKSPACE/Patches/Patch/susfs_upgrade_to_157.patch"
          echo "Checking SUSFS v1.5.7 version marker patch..."
          patch --dry-run --batch --forward --fuzz=0 -p1 < "$patch"
          patch --batch --forward --fuzz=0 -p1 < "$patch"
          grep -q 'SUSFS_VERSION "v1.5.7"' include/linux/susfs.h
          ! grep -q 'CL_ZYGOTE_COPY_MNT_NS\|current->susfs_last_fake_mnt_id' fs/namespace.c

      - name: Configure A13VE kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          clang --version
          command -v aarch64-linux-gnu-ld
          mkdir -p out
          make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- "$DEFCONFIG"
          scripts/config --file out/.config \
            --enable ARM64 \
            --enable 64BIT \
            --enable KSU \
            --enable KSU_SUSFS \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable KPROBES \
            --enable KRETPROBES \
            --enable EXT4_FS \
            --enable KPM
          make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^CONFIG_KPM=y$' out/.config
          grep -q '^CONFIG_KALLSYMS=y$' out/.config
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config
          grep -q 'KSU_CAN_USE_KPM' drivers/kernelsu/kernel_compat.h
          grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KPM|CONFIG_KALLSYMS|CONFIG_KALLSYMS_ALL|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_EXT4_FS)=' out/.config

      - name: Build kernel Image.gz
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export KCFLAGS=-w
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          make -s O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j"$JOBS"
          test -s out/arch/arm64/boot/Image.gz
          gzip -t out/arch/arm64/boot/Image.gz

      - name: Prepare AnyKernel3 package
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz

          cat > AnyKernel3/anykernel.sh <<'AK'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers
          # Edit by @physwizz Generic
          ## AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=Legion Kernel for mt6768 - A13VE - SukiSU Nova - SUSFS v1.5.7
          do.devicecheck=0
          do.modules=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=a13ve
          device.name2=SM-A137F
          supported.versions=
          '; } # end properties

          # Use the same proven boot-image flow as TouchGrass Kernel v0.4.
          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;

          ## AnyKernel methods (DO NOT CHANGE)
          . tools/ak3-core.sh;

          ui_print "- Unpacking boot image";
          dump_boot;

          mount /system/
          mount /system_root/

          ui_print "- Installing new boot image";
          write_boot;

          ui_print "- Done";
          ui_print " ";
          ## end install
          AK
          chmod 0755 AnyKernel3/anykernel.sh

          # Validate the kernel image and the exact installer that will ship.
          test -s AnyKernel3/Image.gz
          gzip -t AnyKernel3/Image.gz
          sh -n AnyKernel3/anykernel.sh
          (cd AnyKernel3 && zip -r9 "$GITHUB_WORKSPACE/A13VE-SukiSU-Nova-SUSFS.zip" . -x "*.git*" "*.github*")
          test -s A13VE-SukiSU-Nova-SUSFS.zip
          unzip -t A13VE-SukiSU-Nova-SUSFS.zip
          unzip -p A13VE-SukiSU-Nova-SUSFS.zip anykernel.sh > "$RUNNER_TEMP/packaged-anykernel.sh"
          sh -n "$RUNNER_TEMP/packaged-anykernel.sh"
          grep -qF '. tools/ak3-core.sh' "$RUNNER_TEMP/packaged-anykernel.sh"
          grep -qF 'block=/dev/block/by-name/boot;' "$RUNNER_TEMP/packaged-anykernel.sh"
          grep -qF 'dump_boot;' "$RUNNER_TEMP/packaged-anykernel.sh"
          grep -qF 'write_boot;' "$RUNNER_TEMP/packaged-anykernel.sh"
          ! grep -qE '(^|[[:space:]])(BLOCK=|split_boot|flash_boot)' "$RUNNER_TEMP/packaged-anykernel.sh"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A13VE-SukiSU-Nova-SUSFS
          path: |
            A13VE-SukiSU-Nova-SUSFS.zip
            kernel/out/arch/arm64/boot/Image.gz
          if-no-files-found: error
